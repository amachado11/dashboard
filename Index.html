<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro v6.1 - Com Seletor</title>
    <style>
        :root {
            --primary: #007AFF;
            --success: #34C759;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
        }

        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }

        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        /* SELETOR DE MÊS */
        .month-picker { background: white; padding: 10px 20px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 15px; }
        .month-picker select { padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; color: var(--primary); }

        nav { display: flex; gap: 10px; background: white; padding: 5px 20px 10px; border-bottom: 1px solid #ddd; }
        .nav-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-weight: bold; color: #666; border-radius: 8px; }
        .nav-btn.active { background: var(--primary); color: white; }

        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .aba { display: none; }
        .aba.active { display: block; }

        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-kpi { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .card-kpi p { margin: 5px 0 0; font-size: 22px; font-weight: bold; }

        .table-container { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f8f8; padding: 12px; text-align: left; font-size: 13px; color: #666; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }

        .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-ganho { background: #e8f5e9; color: var(--success); }
        .badge-gasto { background: #ffebee; color: var(--danger); }

        .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .bar-label { width: 110px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { flex: 1; height: 8px; background: #eee; border-radius: 4px; }
        .bar-fill { height: 100%; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">Finanças Pro <span style="font-weight: 300;">v6.1</span></div>
</header>

<div class="month-picker">
    <label style="font-size: 13px; font-weight: bold; color: #666;">PERÍODO ANALISADO:</label>
    <select id="select-mes" onchange="atualizarTudo()">
        <option value="01">Janeiro</option>
        <option value="02">Fevereiro</option>
        <option value="03">Março</option>
        <option value="04">Abril</option>
        <option value="05">Maio</option>
        <option value="06">Junho</option>
        <option value="07">Julho</option>
        <option value="08">Agosto</option>
        <option value="09">Setembro</option>
        <option value="10">Outubro</option>
        <option value="11">Novembro</option>
        <option value="12">Dezembro</option>
    </select>
    <select id="select-ano" onchange="atualizarTudo()">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
    </select>
</div>

<nav>
    <button id="btn-cat" class="nav-btn active" onclick="irAba('aba-categorizar', this)">Categorizar</button>
    <button id="btn-res" class="nav-btn" onclick="irAba('aba-resumo', this)">Resumo</button>
</nav>

<div class="content">
    <div id="aba-categorizar" class="aba active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Categoria</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
        </div>
    </div>

    <div id="aba-resumo" class="aba">
        <div class="grid-kpi">
            <div class="card-kpi"><h3>Ganhos</h3><p id="total-ganhos" style="color: var(--success);">R$ 0</p></div>
            <div class="card-kpi"><h3>Gastos</h3><p id="total-gastos" style="color: var(--danger);">R$ 0</p></div>
            <div class="card-kpi"><h3>Saldo</h3><p id="saldo-total">R$ 0</p></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="table-container" style="padding: 15px;">
                <h4 style="margin:0 0 15px">Gastos / Categoria</h4>
                <div id="ranking-gastos"></div>
            </div>
            <div class="table-container" style="padding: 15px;">
                <h4 style="margin:0 0 15px">Ganhos / Categoria</h4>
                <div id="ranking-ganhos"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('financas_v_final')) || [];
    let regras = JSON.parse(localStorage.getItem('insight_regras')) || [];
    let categorias = JSON.parse(localStorage.getItem('insight_categorias_v2')) || {
        gastos: ['Aluguel', 'Gasolina', 'Comida', 'Saúde', 'Besteira', 'Luz', 'Água', 'Cartão', 'Lazer', 'Juliana', 'Benjamim'],
        ganhos: ['Uber', '99', 'Particular', 'Reembolso', 'Empréstimo']
    };

    function irAba(idAba, btn) {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(idAba).classList.add('active');
        btn.classList.add('active');
        atualizarTudo();
    }

    function aplicarRegra(desc) {
        const r = regras.find(reg => desc.trim().toLowerCase() === reg.termo);
        return r ? r.categoria : '';
    }

    function filtrarDados() {
        const mesSel = document.getElementById('select-mes').value;
        const anoSel = document.getElementById('select-ano').value;
        
        return db.filter(item => {
            const parts = item.data.split('/');
            return parts[1] === mesSel && parts[2] === anoSel;
        });
    }

    function atualizarTudo() {
        const dadosFiltrados = filtrarDados();
        renderCategorizar(dadosFiltrados);
        renderResumo(dadosFiltrados);
    }

    function renderCategorizar(dados) {
        const corpo = document.getElementById('corpo-tabela');
        if (dados.length === 0) {
            corpo.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:20px'>Nenhum dado para este mês.</td></tr>";
            return;
        }

        corpo.innerHTML = dados.map(item => {
            const catAtual = aplicarRegra(item.desc);
            const listaCats = item.tipo === 'ganho' ? categorias.ganhos : categorias.gastos;
            return `
                <tr>
                    <td>${item.data.substring(0,5)}</td>
                    <td><small>${item.tipo === 'ganho' ? '▲' : '▼'}</small> ${item.desc}</td>
                    <td style="font-weight:bold">R$ ${parseFloat(item.valor).toLocaleString('pt-br', {minimumFractionDigits:2})}</td>
                    <td>
                        <select onchange="salvarRegra('${item.desc}', this.value, '${item.tipo}')">
                            <option value="">...</option>
                            ${listaCats.map(c => `<option value="${c}" ${c === catAtual ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                    </td>
                </tr>`;
        }).join('');
    }

    function salvarRegra(termoOriginal, novaCat, tipo) {
        const termo = termoOriginal.trim().toLowerCase();
        regras = regras.filter(r => r.termo !== termo);
        if(novaCat) regras.push({ termo: termo, categoria: novaCat, tipo: tipo });
        localStorage.setItem('insight_regras', JSON.stringify(regras));
        atualizarTudo(); 
    }

    function renderResumo(dados) {
        let vGanhos = 0, vGastos = 0;
        let sumGastos = {}, sumGanhos = {};

        dados.forEach(i => {
            const v = parseFloat(i.valor);
            const cat = aplicarRegra(i.desc) || 'Não Categorizado';
            if(i.tipo === 'ganho') { vGanhos += v; sumGanhos[cat] = (sumGanhos[cat] || 0) + v; }
            else { vGastos += v; sumGastos[cat] = (sumGastos[cat] || 0) + v; }
        });

        document.getElementById('total-ganhos').innerText = `R$ ${vGanhos.toLocaleString('pt-br', {minimumFractionDigits:2})}`;
        document.getElementById('total-gastos').innerText = `R$ ${vGastos.toLocaleString('pt-br', {minimumFractionDigits:2})}`;
        const saldo = vGanhos - vGastos;
        document.getElementById('saldo-total').innerText = `R$ ${saldo.toLocaleString('pt-br', {minimumFractionDigits:2})}`;
        document.getElementById('saldo-total').style.color = saldo >= 0 ? 'var(--success)' : 'var(--danger)';

        const criarRanking = (id, obj, color) => {
            const el = document.getElementById(id);
            const ordenado = Object.entries(obj).sort((a,b) => b[1] - a[1]);
            const max = ordenado.length > 0 ? ordenado[0][1] : 1;
            el.innerHTML = ordenado.map(([cat, val]) => `
                <div class="bar-row">
                    <div class="bar-label">${cat}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${(val/max)*100}%; background:${color}"></div></div>
                    <div style="font-size:11px; font-weight:bold; width:70px; text-align:right">R$ ${Math.round(val)}</div>
                </div>`).join('') || '<small>Sem dados</small>';
        };
        criarRanking('ranking-gastos', sumGastos, 'var(--danger)');
        criarRanking('ranking-ganhos', sumGanhos, 'var(--success)');
    }

    window.onload = () => {
        const hoje = new Date();
        const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
        document.getElementById('select-mes').value = mesAtual;
        atualizarTudo();
    };
</script>
</body>
</html>
